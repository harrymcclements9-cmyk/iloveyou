<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Glowing Love Heart</title>

<style>
    body {
        margin: 0;
        overflow: hidden;
        background: black;
    }
    canvas {
        display: block;
    }

    /* optional overlay for click-to-play */
    #overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: Arial;
        background: rgba(0,0,0,0.6);
        cursor: pointer;
    }
</style>
</head>
<body>

<div id="overlay">Click to start ❤️</div>
<canvas id="canvas"></canvas>

<!-- IMPORTANT: you must supply this audio file -->
<audio id="music" loop>
    <source src="i-love-you.mp3" type="audio/mpeg">
</audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const music = document.getElementById("music");
const overlay = document.getElementById("overlay");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let angle = 0;
let pulse = 0;

overlay.addEventListener("click", () => {
    music.play();
    overlay.style.display = "none";
});

function drawHeartText(x, y, glowSize) {
    ctx.save();

    // Glow effect
    ctx.shadowColor = "rgba(255, 100, 150, 0.8)";
    ctx.shadowBlur = glowSize;

    ctx.fillStyle = "rgb(255,150,200)";
    ctx.font = "20px Arial";
    ctx.fillText("I love you", x, y);

    ctx.restore();
}

function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let numSteps = 80;
    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;

    // Pulsing scale
    let scale = 18 + Math.sin(pulse) * 3;
    let glow = 10 + Math.sin(pulse) * 10;

    for (let i = 0; i < numSteps; i++) {
        let t = i * (2 * Math.PI / numSteps) + angle;

        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t)
              - 5 * Math.cos(2 * t)
              - 2 * Math.cos(3 * t)
              - Math.cos(4 * t);

        let posX = x * scale + centerX;
        let posY = -y * scale + centerY;

        drawHeartText(posX, posY, glow);
    }

    angle += 0.03;
    pulse += 0.05;

    requestAnimationFrame(animate);
}

animate();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});
</script>

</body>
</html>
